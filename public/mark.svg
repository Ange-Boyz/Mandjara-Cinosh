<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 234" width="240" height="234">
  <g fill="none">
    <!-- Two arms rising from opposite sides to meet at a shared point of light -->
    <path d="M28,214 Q58,88 118,52" stroke="#F0B429" stroke-width="24" stroke-linecap="round"/>
    <path d="M212,214 Q182,88 122,52" stroke="#F0B429" stroke-width="24" stroke-linecap="round"/>
    <!-- The shared light where the two arms meet -->
    <circle cx="120" cy="50" r="15" fill="#F0B429" stroke="none"/>
    <!-- The road between them, built of filmstrip -->
    <rect x="34" y="206" width="172" height="18" rx="4" fill="#F0B429" stroke="none"/>
    <rect x="46" y="196" width="6" height="11" fill="#F0B429" stroke="none"/>
    <rect x="70" y="196" width="6" height="11" fill="#F0B429" stroke="none"/>
    <rect x="94" y="196" width="6" height="11" fill="#F0B429" stroke="none"/>
    <rect x="140" y="196" width="6" height="11" fill="#F0B429" stroke="none"/>
    <rect x="164" y="196" width="6" height="11" fill="#F0B429" stroke="none"/>
    <rect x="188" y="196" width="6" height="11" fill="#F0B429" stroke="none"/>
  </g>
</svg>
